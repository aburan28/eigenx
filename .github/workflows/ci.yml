name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Release tests including Toy16
        run: cargo test --release
      - name: Ignored Toy32 round trip
        run: cargo test --release -- --ignored
      - name: L1 full-size KEM round trip
        run: cargo run --release --example run -- L1 1
      - name: L1 authenticated PKE round trip
        run: cargo run --release --example pke_run -- L1
